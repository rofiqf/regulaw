version: '3.8'

services:
  rag-agent:
    build: .
    container_name: regulaw_rag_agent
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-lmstudio}
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-http://192.168.200.6:1234/v1}
      - LM_STUDIO_API_KEY=${LM_STUDIO_API_KEY:-lm-studio}
      - LM_STUDIO_MODEL=${LM_STUDIO_MODEL:-qwen2.5-3b-instruct}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - HF_HOME=/app/cache/huggingface
    volumes:
      - ./papers:/app/papers
      - ./output:/app/output
      - ./model_cache:/app/cache
    restart: unless-stopped
